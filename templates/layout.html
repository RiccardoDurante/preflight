{# Base layout for all pages. #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PreFlight{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom bg-white">
        <div class="container">
            <a class="navbar-brand brand" href="{{ url_for('index') }}">
                <span class="brand-mark">PF</span>
                PreFlight
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('index') }}">New analysis</a>
                <a class="nav-link" href="{{ url_for('history') }}">History</a>
                <a class="nav-link" href="{{ url_for('about') }}">About</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="container text-muted small py-4 border-top">
        PreFlight — a CS50 Final Project on pre-release metadata validation.
    </footer>
</body>
</html>
